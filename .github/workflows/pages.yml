name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check controls and game integration
        run: |
          node scripts/verify-physics.mjs
          node scripts/verify-streaming.mjs
          node scripts/verify-analytics.mjs
          node scripts/verify-controls.mjs
          node scripts/verify-runtime-coordinates.mjs
          node scripts/verify-runtime-coordinates.mjs --mobile
      - name: Build game
        run: npm run build
      - name: Check baked campus fidelity and destruction
        run: node --max-old-space-size=4096 scripts/verify-campus-snapshot.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload game
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v5
