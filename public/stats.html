<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 통계 | Campus Smash</title><style>body{max-width:960px;margin:36px auto;padding:0 20px;font:16px/1.7 system-ui;color:#000;background:#fff}input,button{font:inherit;padding:10px;max-width:100%}form{display:flex;gap:10px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{border-bottom:1px solid #ccc;padding:10px;text-align:right}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto}a{color:inherit}</style></head><body><h1>Campus Smash 접속 통계</h1><p>관리자 암호를 입력하세요. 암호는 이 페이지의 메모리에서만 사용하며 URL이나 브라우저 저장소에 보관하지 않습니다.</p><form id="login"><label>관리자 암호 <input id="password" type="password" autocomplete="current-password" required></label><button>통계 보기</button><button type="button" id="logout">잠그기</button></form><p id="status" role="status"></p><div id="results" hidden><p id="summary"></p><p>한국 시간 기준 최근 30일입니다. 방문자는 하루 동안의 브라우저 번호를 기준으로 한 추정치입니다. 아래 행의 방문자 수를 합쳐 월간 순방문자 수로 해석하지 마세요. 두 주소와 기기 사이 중복, 자동화 접속과 누락이 있을 수 있습니다.</p><div class="scroll"><table><thead><tr><th>날짜</th><th>주소</th><th>기기</th><th>접속</th><th>시작</th><th>방문자 추정</th></tr></thead><tbody id="rows"></tbody></table></div></div><p><a href="./index.html">게임</a> / <a href="./privacy.html">집계 기준</a></p>
<script>const form=document.getElementById('login'),password=document.getElementById('password'),status=document.getElementById('status'),results=document.getElementById('results'),rows=document.getElementById('rows');let generation=0;document.getElementById('logout').onclick=()=>{generation++;password.value='';rows.replaceChildren();results.hidden=true;status.textContent='통계를 잠갔습니다.'};form.onsubmit=async e=>{e.preventDefault();const requestGeneration=++generation;results.hidden=true;rows.replaceChildren();status.textContent='불러오는 중';try{const response=await fetch('https://snu-gate-campus-break.lee1010202001.chatgpt.site/api/stats',{headers:{Authorization:'Bearer '+password.value},cache:'no-store',credentials:'omit'});if(!response.ok)throw Error(response.status===401?'암호를 확인해 주세요.':'통계를 불러오지 못했습니다.');const data=await response.json();if(requestGeneration!==generation)return;let views=0,starts=0;for(const item of data.rows){views+=item.views;starts+=item.starts;const row=document.createElement('tr');for(const value of [item.day,item.host,item.device,item.views,item.starts,item.visitors]){const td=document.createElement('td');td.textContent=String(value);row.append(td)}rows.append(row)}document.getElementById('summary').textContent=`최근 30일 접속 ${views}회, 탐험 시작 ${starts}회`;results.hidden=false;status.textContent=data.rows.length?'통계를 불러왔습니다.':'아직 집계된 접속이 없습니다.'}catch(error){if(requestGeneration===generation)status.textContent=error.message}};</script></body></html>
